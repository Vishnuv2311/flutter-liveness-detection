name: flutter_liveness_detection_plugin
description: "A Flutter plugin for liveness detection with challenge response method"
version: 1.2.1
homepage: "https://github.com/Vishnuv2311/flutter-liveness-detection"
repository: "https://github.com/Vishnuv2311/flutter-liveness-detection"

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.7'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  google_mlkit_face_detection: ^0.13.2
  camera: ^0.12.0
  equatable: ^2.0.8
  image: ^4.9.1
  path_provider: ^2.1.5
  lottie: ^3.3.3
  collection: ^1.19.1
  screen_brightness: ^2.1.9
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.vishnuv.flutter_liveness_detection_plugin
        pluginClass: FlutterLivenessDetectionPlugin
      ios:
        pluginClass: FlutterLivenessDetectionPlugin

  assets:
    - packages/flutter_liveness_detection_plugin/src/core/assets/face-id-anim.json
    - packages/flutter_liveness_detection_plugin/src/core/assets/face-detected.json